[project]
name = "cli-todo-app"
version = "0.1.0"
description = "CLI 기반 ToDo 관리 앱"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "typer>=0.12,<0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=todo_lib --cov=cli --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "contract: CLI contract tests",
    "integration: integration tests",
    "unit: unit tests",
]

[tool.coverage.run]
branch = true
source = ["todo_lib", "cli"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.uv]
default-groups = ["dev"]